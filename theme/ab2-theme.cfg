# The AutoBleem 2 look (ab2.0.0) for RetroArch 1.22.2: the keys that point at theme/assets and the 720p wallpaper.
# Set by the installer only AFTER those files are on the stick (never by an installer that predates the theme -
# that one reads retroarch-psc.cfg alone, which keeps its old keys and meaning). Everything else in the user's
# retroarch.cfg stays.
#   xmb_theme 6 = Custom (assets/xmb/custom, the set's tiles and glyphs); Ozone loads assets/xmb/monochrome/png
#   and tints it. menu_wallpaper: the 1280x720 mozaika (the console is 720p), static (no per-system wallpapers).
menu_wallpaper = ":/Retroarch themes/ab2-1280x720.png"
menu_dynamic_wallpaper_enable = "false"
xmb_theme = "6"
xmb_menu_color_theme = "10"
xmb_font = ":/assets/xmb/custom/font.ttf"
ozone_menu_color_theme = "1"
menu_use_preferred_system_color_theme = "false"
