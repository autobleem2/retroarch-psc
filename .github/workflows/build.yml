# RetroArch + libretro cores for the PlayStation Classic.
#
# Jobs:
#   image      the cores build environment (Dockerfile target `cores`, which contains the toolchain) ->
#              ghcr.io/<owner>/retroarch-psc/cores:<sha> and :latest. The crosstool-ng stage takes ~45 min
#              the first time; the registry cache keeps it, so a later run that changes nothing under the
#              toolchain stage is minutes.
#   retroarch  the retroarch binary (target `retroarch-out`), from the same cache.
#   cores      cores/cores.txt split into SHARDS slices, one runner each, all pulling the image.
#   package    the two archives + manifest.json (make package); on a v* tag also a draft GitHub release.
#
# Triggers: a push to main and a pull request build the image and RetroArch (cheap once cached); a v* tag
# builds everything and drafts the release; "Run workflow" chooses (all cores, or a few by name).

name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      cores:
        description: build the cores (all shards)
        type: boolean
        default: true
      only:
        description: build only these cores (space-separated; empty = cores.txt)
        type: string
        default: ''
      shards:
        description: how many runners the cores are spread over
        type: number
        default: 16

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}/cores

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (the toolchain stage needs it)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Build the cores image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: cores
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE }}:cache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}:cache,mode=max', env.IMAGE) || '' }}

  retroarch:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: echo "tag=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
      - name: Build RetroArch
        uses: docker/build-push-action@v6
        with:
          context: .
          target: retroarch-out
          outputs: type=local,dest=dist/retroarch
          build-args: |
            PSC_BUILD_NUM=${{ steps.tag.outputs.tag }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:cache
      - name: Check the binary
        run: |
          ls -l dist/retroarch
          cat dist/retroarch/VERSION
          sudo apt-get install -y -q binutils-arm-linux-gnueabihf >/dev/null
          arm-linux-gnueabihf-readelf -A dist/retroarch/retroarch | head -12
          echo "highest GLIBC / GLIBCXX needed:"
          arm-linux-gnueabihf-readelf -V dist/retroarch/retroarch | grep -oE 'GLIBC(XX)?_[0-9.]+' | sort -uV | tail -4
      - uses: actions/upload-artifact@v4
        with:
          name: retroarch
          path: dist/retroarch
          retention-days: 30

  shards:
    # Which cores go to which runner: the enabled list (or the dispatch's `only`) dealt round-robin.
    needs: image
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.cores)
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.split.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: split
        run: |
          n='${{ inputs.shards || 16 }}'
          if [ -n '${{ inputs.only }}' ]; then
            printf '%s\n' ${{ inputs.only }} > /tmp/cores.txt
          else
            sed 's/#.*//' cores/cores.txt | tr -d ' \t' | grep -v '^$' > /tmp/cores.txt
          fi
          total=$(wc -l < /tmp/cores.txt)
          [ "$n" -gt "$total" ] && n=$total
          python3 - "$n" <<'EOF' >> "$GITHUB_OUTPUT"
          import json, sys
          n = int(sys.argv[1])
          cores = [l.strip() for l in open('/tmp/cores.txt') if l.strip()]
          shards = [{"id": i, "cores": " ".join(cores[i::n])} for i in range(n)]
          print("matrix=" + json.dumps({"shard": shards}))
          EOF

  cores:
    needs: [image, shards]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.shards.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker pull ${{ env.IMAGE }}:${{ needs.image.outputs.tag }}
      - name: Build shard ${{ matrix.shard.id }}
        run: |
          mkdir -p dist/cores build_metadata build_status/logs
          failed=0
          for core in ${{ matrix.shard.cores }}; do
            echo "::group::$core"
            if docker run --rm -e JOBS=4 \
                -v "$PWD/dist/cores:/build/output" -v "$PWD/build_metadata:/build/metadata" \
                ${{ env.IMAGE }}:${{ needs.image.outputs.tag }} /build/build-core.sh "$core" \
                > "build_status/logs/$core.log" 2>&1 && [ -f "dist/cores/${core}_libretro.so" ]; then
              echo "OK   $core ($(stat -c %s "dist/cores/${core}_libretro.so") bytes)"
              echo "$core" >> build_status/success.txt
            else
              echo "FAIL $core"; tail -30 "build_status/logs/$core.log"
              echo "$core" >> build_status/failed.txt
              failed=$((failed + 1))
            fi
            echo "::endgroup::"
          done
          echo "## shard ${{ matrix.shard.id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "built: $(cat build_status/success.txt 2>/dev/null | tr '\n' ' ')" >> "$GITHUB_STEP_SUMMARY"
          [ -f build_status/failed.txt ] && echo "FAILED: $(cat build_status/failed.txt | tr '\n' ' ')" >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: cores-${{ matrix.shard.id }}
          path: |
            dist/cores
            build_metadata
            build_status
          retention-days: 30

  package:
    needs: [image, retroarch, cores]
    if: always() && needs.retroarch.result == 'success' && needs.cores.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker pull ${{ env.IMAGE }}:${{ needs.image.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          name: retroarch
          path: dist/retroarch
      - uses: actions/download-artifact@v4
        with:
          pattern: cores-*
          path: shards
      - name: Merge the shards
        run: |
          mkdir -p dist/cores build_metadata/commits build_status
          for d in shards/cores-*; do
            cp -a "$d/dist/cores/." dist/cores/ 2>/dev/null || true
            cp -a "$d/build_metadata/." build_metadata/ 2>/dev/null || true
            cat "$d/build_status/failed.txt" >> build_status/failed.txt 2>/dev/null || true
            cat "$d/build_status/success.txt" >> build_status/success.txt 2>/dev/null || true
          done
          echo "built $(ls dist/cores/*.so | wc -l) cores"
          if [ -s build_status/failed.txt ]; then
            echo "::warning::cores that failed to build: $(tr '\n' ' ' < build_status/failed.txt)"
            { echo "## failed cores"; sed 's/^/- /' build_status/failed.txt; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Package
        run: make package CORES_IMAGE=${{ env.IMAGE }}:${{ needs.image.outputs.tag }} ALLOW_MISSING=1
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/release
          retention-days: 30
      - name: Draft the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ github.ref_name }}'
          notes=$(ls dist/release/*.md | head -1)
          gh release create "$tag" --draft --title "$tag" --notes-file "$notes" \
            dist/release/*.zip dist/release/*.tar.gz dist/release/manifest.json
