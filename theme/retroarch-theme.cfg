# The AutoBleem 2 look for RetroArch 1.22.2's XMB on the PlayStation Classic - the keys the installer
# sets in retroarch.cfg (and what to copy where, see README.md). RetroBoot's cfg carried the same idea
# for RetroArch 1.9.0; two of its values no longer mean the same thing in 1.22.2, which is what made
# its theme come out wrong on the new build:
#   xmb_theme: the icon-theme enum lost two entries (RetroActive, NeoActive) - RetroBoot's "8"
#              (RetroSystem in 1.9.0) is Monochrome Inverted in 1.22.2, dark icons on a dark wallpaper.
#              RetroSystem is 7 now.
#   menu_swap_ok_cancel_buttons: renamed input_menu_swap_ok_cancel_buttons (Cross = OK).
menu_driver = "xmb"
menu_wallpaper = ":/Retroarch themes/Autobleem2.png"
menu_wallpaper_opacity = "0.600000"
xmb_menu_color_theme = "10"
xmb_theme = "7"
xmb_font = ":/fonts/selawik-light.ttf"
xmb_shadows_enable = "true"
xmb_alpha_factor = "75"
xmb_layout = "0"
xmb_scale_factor = "100"
menu_font_color_red = "255"
menu_font_color_green = "255"
menu_font_color_blue = "255"
input_menu_swap_ok_cancel_buttons = "true"
