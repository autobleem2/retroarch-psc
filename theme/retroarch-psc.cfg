# What the installer sets in retroarch.cfg for RetroArch 1.22.2 on the PlayStation Classic: the AutoBleem 2
# look for XMB (see README.md for what to copy where) and the behaviour a RetroBoot-era cfg no longer
# gets from a newer RetroArch:
#   xmb_theme: the icon-theme enum lost two entries (RetroActive, NeoActive) - RetroBoot's "8"
#              (RetroSystem in 1.9.0) is Monochrome Inverted in 1.22.2, dark icons on a dark wallpaper.
#              RetroSystem is 7 now.
#   quit_on_close_content: 1.9.0 simply quit when content given on the command line was closed - every
#              AutoBleem launch - and 1.10+ made that a setting whose default is "never", so 1.22.2 fell
#              back to XMB instead of returning to the launcher. 2 = quit when the content came from the
#              command line (not when a game was opened inside XMB in RetroArch mode).
#   video_context_driver: "" means KMS first, which the console's Weston blocks - wayland it is.
#   menu_swap_ok_cancel_buttons: true = Cross is OK in RetroArch's menus (a core's own menu, Doom's say,
#              is the core's mapping: RetroPad A = Circle there).
menu_driver = "xmb"
menu_wallpaper = ":/Retroarch themes/Autobleem2.png"
menu_wallpaper_opacity = "0.600000"
xmb_menu_color_theme = "10"
xmb_theme = "7"
xmb_font = ":/fonts/selawik-light.ttf"
xmb_shadows_enable = "true"
xmb_alpha_factor = "75"
xmb_layout = "0"
xmb_scale_factor = "100"
menu_font_color_red = "255"
menu_font_color_green = "255"
menu_font_color_blue = "255"
menu_swap_ok_cancel_buttons = "true"
quit_on_close_content = "2"
video_context_driver = "wayland"
video_driver = "gl"
input_driver = "udev"
input_joypad_driver = "udev"
