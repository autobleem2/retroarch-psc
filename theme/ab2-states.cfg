# AutoBleem's save states for games played through RetroArch (the launcher's four slots, EMU-24).
# Set by the installer that knows this file (autobleem-core, installer_job.cpp) in retroarch.cfg; an installer that
# predates it never reads it, so a stick updated by that one is exactly what it was.
#   savestate_auto_save: RetroArch writes <game>.state.auto when a game ends (menu Quit, Close Content, the front
#   RESET key, SIGTERM) - the launcher keeps it as one of the game's four slots. savestate_thumbnail_enable: its picture
#   (<state>.png) - off by default on ARM. The folder is the same on every platform and is not sorted into a
#   folder per core, so the file is exactly savestates/<game>.state.auto. savestate_auto_load is NOT here: the
#   launcher sets it per launch (resume a slot or start fresh), so a state that cannot be loaded can never loop.
savestate_auto_save = "true"
savestate_thumbnail_enable = "true"
savestate_directory = ":/savestates"
sort_savestates_enable = "false"
sort_savestates_by_content_enable = "false"
savestates_in_content_dir = "false"
